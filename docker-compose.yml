services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: greenbasket
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: greenbasket
    ports:
      - "5432:5432"
    volumes:
      - greenbasket-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenbasket"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://greenbasket:${DB_PASSWORD}@db:5432/greenbasket
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  ml:
    build: ./ml
    env_file: .env
    environment:
      DATABASE_URL: postgresql://greenbasket:${DB_PASSWORD}@db:5432/greenbasket
    volumes:
      - ./models:/models
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  greenbasket-db-data:
    external: true